name: Galerías
boxes:
- hn: h1
  box:
    gap: 3
  get:
  - from: title
    to: title
  - from: gallery.sub
    to: sub
  boxes:
  - gallery:
      cols: 6
      type: cols
      btn: hide
    get:
    - from: gallery_cols
      to: gallery.cols
    - from: gallery_type
      to: gallery.type
    - from: imgs
      to: imgs
  - if: features
    fit: 0.75
    box:
      cols: 2
    boxes:
    - hn: h2
      get:
      - from: gallery.features
        to: title
      - from: features
        to: md
    - if: aftercares
      hn: h2
      get:
      - from: gallery.aftercares
        to: title
      - from: aftercares
        to: md
  - if: content
    md: |
      {{< content >}}
  - url: /
    pin: home
    get:
    - from: gallery.label
      to: label
