name: Contacto
menu_btn: cta
boxes:
- box:
    cols: 2
    gap: 3
    align_y: center
  get:
  - from: contact.title
    to: title
  - from: contact.sub
    to: sub
  boxes:
  - fit: 1.3
    when:
    - days: '{{ get contact.days }}'
      hours: 11:00 - 14:00 y 17:00 - 20:00
      full: true
      links: null
    links:
    - type: phone
      label: '{{ get org.phones.0 }}'
    - type: whatsapp
      label: '{{ get org.phones.0 }}'
    - type: custom
      icon: brand:instagram
      label: '@saudace_piercing'
      url: https://www.instagram.com/saudace_piercing/
      lock: true
      btn: turn
      swap: true
      ga4: true
    - type: custom
      icon: calendar_today
      label: '{{ get contact.meet }}'
      url: https://inkoru.com/SCkjCb
      lock: true
      ga4: true
    - type: address
      label: '{{ get org.address.0.street }}, {{ get org.address.0.pc }} {{ get org.address.0.locality }}'
      anchor: '{{ address-url }}'
      btn: turn
  - fit: 0.7
    rate: 3/2
    geos:
    - type: point
      geo: '{"type":"Point","coordinates":[-1.1275327,37.9874351]}'
